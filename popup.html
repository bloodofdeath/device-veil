<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Device Veil</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 3 19 6v5c0 4.8-2.9 8-7 10-4.1-2-7-5.2-7-10V6l7-3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="m9 12 2 2 4-4" stroke="#59dda6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="title-group">
          <div class="title-row">
            <h1>Device Veil</h1>
            <span class="badge">v1.1</span>
          </div>
          <p class="subtitle">Защита цифрового отпечатка</p>
        </div>
      </header>

      <section class="status-card" aria-live="polite">
        <span id="status-indicator" class="status-indicator"></span>
        <div class="card-copy">
          <p id="status-title" class="status-title">Загрузка…</p>
          <p id="status-caption" class="status-caption">Настройки защиты</p>
        </div>
        <label class="switch" aria-label="Включить защиту">
          <input id="enabled" type="checkbox">
          <span class="slider"></span>
        </label>
      </section>

      <section id="site-card" class="site-card hidden">
        <div class="card-copy">
          <p class="site-label">Текущий сайт</p>
          <p id="site-host" class="site-host">—</p>
        </div>
        <button id="site-toggle" class="site-btn" type="button">Пауза</button>
      </section>

      <section id="modules-section" class="modules" aria-label="Модули защиты">
        <div class="module-group">
          <label class="module-row">
            <div class="module-copy">
              <span class="module-title">Экран и разрешение</span>
              <span class="module-desc">Размер экрана, панель задач, масштаб DPR</span>
            </div>
            <span class="switch small">
              <input id="mask-screen" type="checkbox">
              <span class="slider"></span>
            </span>
          </label>
          <div id="preset-row" class="preset-row">
            <label for="screen-preset" class="preset-label">Профиль:</label>
            <select id="screen-preset" class="preset-select">
              <option value="1920x1080">1920 × 1080 (DPR 1x · Full HD)</option>
              <option value="1536x864">1536 × 864 (DPR 1.25x · Ноутбук)</option>
              <option value="2560x1440">2560 × 1440 (DPR 1x · QHD)</option>
              <option value="1366x768">1366 × 768 (DPR 1x · HD)</option>
            </select>
          </div>
        </div>

        <label class="module-row">
          <div class="module-copy">
            <span class="module-title">Платформа и периферия</span>
            <span class="module-desc">8 ядер, 8 ГБ, языки, сеть, батарея, квота</span>
          </div>
          <span class="switch small">
            <input id="mask-navigator" type="checkbox">
            <span class="slider"></span>
          </span>
        </label>

        <label class="module-row">
          <div class="module-copy">
            <span class="module-title">Графика WebGL / WebGPU</span>
            <span class="module-desc">Массовый профиль Intel UHD 630 (ANGLE)</span>
          </div>
          <span class="switch small">
            <input id="mask-webgl" type="checkbox">
            <span class="slider"></span>
          </span>
        </label>

        <label class="module-row">
          <div class="module-copy">
            <span class="module-title">Canvas, Audio и шрифты</span>
            <span class="module-desc">Сессионный шум и базовые шрифты Windows</span>
          </div>
          <span class="switch small">
            <input id="mask-fingerprint" type="checkbox">
            <span class="slider"></span>
          </span>
        </label>
      </section>

      <div id="reload-bar" class="reload-bar hidden">
        <span>Обновите вкладку для полного применения</span>
        <button id="reload-btn" class="reload-btn" type="button">Обновить</button>
      </div>

      <div class="details">
        <p class="note">Это не VPN: IP-адрес, часовой пояс и HTTP-заголовки расширение не скрывает.</p>
      </div>
      <footer>Работает локально · без телеметрии</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
